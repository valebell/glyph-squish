name: Advance development version

on:
  create:

permissions:
  contents: read

jobs:
  bump-dev:
    name: Advance dev after a release branch is created
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/')
    concurrency:
      group: dev-version
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out development version tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false

      # GITHUB_TOKEN commits do not trigger another push workflow; this only changes version metadata.
      - name: Advance dev version without overwriting concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.event.ref }}
        run: python3 tools/bump_dev_github.py
